# Dev stack with hot reload: edits to Server/ restart the API (nodemon), edits to ClientCosmos/
# hot-update the browser (Vite HMR). No rebuilds needed.
#   docker compose -f docker-compose.dev.yml up
# Only run one stack at a time (docker-compose.yml uses the same ports).
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  server:
    image: node:20-bookworm-slim
    working_dir: /app
    # npm install is a fast no-op once node_modules is in the volume; -L polls for file changes
    command: sh -c "npm install && npx nodemon -L server.js"
    depends_on:
      - mongo
    ports:
      - "4002:3000"
    volumes:
      - ./Server:/app
      - server-node-modules:/app/node_modules
    environment:
      MONGODB_URI: mongodb://mongo:27017/cosmos
      JWT_SECRET: dev-jwt-secret-change-me
      SESSION_SECRET: dev-session-secret-change-me
      CLIENT_ORIGIN: http://localhost:5173
      SERVER_URL: http://localhost:4002
      GOOGLE_CLIENT_ID: placeholder-client-id
      GOOGLE_CLIENT_SECRET: placeholder-secret

  client:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./ClientCosmos:/app
      - client-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:4002
      VITE_FIREBASE_API_KEY: x
      VITE_FIREBASE_AUTH_DOMAIN: x.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: x
      VITE_FIREBASE_STORAGE_BUCKET: x.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
      VITE_FIREBASE_APP_ID: 1:0:web:0
      VITE_FIREBASE_MEASUREMENT_ID: G-0

volumes:
  mongo-data:
  server-node-modules:
  client-node-modules:
